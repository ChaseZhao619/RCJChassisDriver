name: Documentation
description: 报告文档错误、链接失效或说明不清
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: 文档位置
      placeholder: 例如：README.md / firmware/stm32_chassis/App/README.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      placeholder: 说明哪里不清楚、过期、错误或链接失效。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      placeholder: 如果你有建议写法，可以贴在这里。
    validations:
      required: false
  - type: checkboxes
    id: audience
    attributes:
      label: 影响读者
      options:
        - label: 初学者/学生
        - label: 固件开发者
        - label: 上位机开发者
        - label: 硬件调试人员
